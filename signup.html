<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Signup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      /* ✅ Background image */
      background: url("/static/images/image1.jpeg") no-repeat center center fixed;
      background-size: cover;
    }

    .signup {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .signup-box {
      /* ✅ Semi-transparent background so text is readable */
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .signup-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="signup">
    <div class="signup-box">
      <h2>College Admin Signup</h2>
      <form method="POST">
        <input type="text" name="college" placeholder="College Name" required />
        <input type="email" name="email" placeholder="Admin Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
      <p>Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
  </div>
</body>
</html>
